<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productcomparision</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="Head Section">
  <nav class="product_comparision_navbar">
        <div class="product_comparision_logo">
            <span class="product_comparision_icon"><img src="./Assets/Meubel House_Logos-05.png" alt=""></span>
            <span class="product_comparision_brand">Furniro</span>
        </div>
        <div class="product_comparision_menu">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Blogs</a>
            <a href="#">Contact</a>
        </div>
        <div class="product_comparision_nav-icons">
              <img src="./Assets/mdi_account-alert-outline.png" alt="">
              <img src="./Assets/akar-icons_search.png" alt="">
              <img src="./Assets/akar-icons_heart.png" alt="">
              <img src="./Assets/ant-design_shopping-cart-outlined.png" alt="">
        </div>
   </nav>  
<header>
    <div class="product_comparision_img">
        <img src="./assets/Rectangle 1.png" alt="" class="product_comparision_img_rectangle">
    </div>
    <div class="product_comparision_overlay">
        <div class="product_comparision_content">
            <img src="./assets/Meubel House_Logos-05.png" alt="." class="product_comparision_logo2">
            <h1>Product Comparison</h1>
            <p><a href="#">Home</a> > Comparison</p>
        </div>
    </div>
</header>
  <div class="product_comparision_container">
    <div class="product_comparision_left-section">
        <h2>Go to Product <br>page for more <br>Products</h2><br>
        <a href="#" class="product_comparision_view-more">View More  .</a>
    </div>
    <div class="product_comparision_product-cards">
        <div class="product_comparision_card">
            <img src="./assets/Asgaard sofa 3.png" alt="Asgaard Sofa" class="product_comparision_asgaard_sofa">
            <h3>Asgaard Sofa</h3>
            <p class="product_comparision_price">Rs. 250,000.00</p>
            <div class="product_comparision_rating">
                <span >4.2 <span class="product_comparision_star"> &#9733;&#9733;&#9733;&#9733;</span></span>
                <span class="product_comparision_reviews">|204 Review</span>
            </div>
        </div>
        <div class="product_comparision_card">
            <img src="./assets/Outdoor sofa set 1.png" alt="Outdoor Sofa Set" class="product_comparision_product_sofa">
            <h3>Outdoor Sofa Set</h3>
            <p class="product_comparision_price">Rs. 224,000.00</p>
            <div class="product_comparision_rating">
                <span >4.2 <span class="product_comparision_star"> &#9733;&#9733;&#9733;&#9733;</span></span>
                <span class="product_comparision_reviews"> |145 Review</span>
            </div>  
        </div>
        <div class="product_comparision_right-section">
                 <div>
                    <h3>Add a product</h3>
                 </div>
             <select class="product_comparision_product_select"><option>Choose a product</option>
                <option>SOFA SET</option>
                <OPtion>OUT DOOR SOFA SET </OPtion>
            </select>  
        </div>
    </div>
</div>
</div>
</body>
</html>
